[project]
name = "meeting-audio-offline"
version = "0.0.0"
description = "Local STT/MT bridge — P3: WhisperLive STT + CTranslate2 MT pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "whisper-live>=0.8.0",
    "websockets>=12.0",
    "ctranslate2>=4.7.1",
    "sentencepiece>=0.2.1",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.9",
]

# MT dependencies — install separately after downloading models:
#   uv add ctranslate2 sentencepiece opencc-python-reimplemented
# Then download model:
#   python -m app.pipeline.translation --download

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
